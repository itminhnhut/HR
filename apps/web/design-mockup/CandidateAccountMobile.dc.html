<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ứng viên – Hồ sơ của tôi (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap">
<style>body{margin:0}
a:focus-visible,button:focus-visible,summary:focus-visible,[role="tab"]:focus-visible{outline:2px solid #4A78C2;outline-offset:2px;border-radius:4px}a{color:#23477F}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #0B1F3A; background: #F5F7FA">
  <section style="background: #0B1F3A; color: #FFFFFF; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="MainMobile.dc.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none">
        <svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="none" stroke="#C5CFDC" stroke-width="1.2"></circle><path d="M7 14c2.6-2.4 5.2-2.4 8 0s5.4 2.4 8 0M7 18.5c2.6-2.4 5.2-2.4 8 0s5.4 2.4 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Playfair Display', Georgia, serif; line-height: 1.2; font-size: 18px; font-weight: 500">[Tên công ty]</span>
      </a>
      <span style="width: 36px; height: 36px; border-radius: 999px; background: #1C3F78; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; line-height: 1.2; font-size: 17px; font-weight: 500">A</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 30px; line-height: 1.15; font-weight: 500">Chào Minh Anh</h1>
      <span style="font-size: 13px; color: #C5CFDC">0912 345 128</span>
    </div>
    <div role="tablist" style="display: flex; gap: 20px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}">
          <button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid #FFFFFF; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF">{{t.label}}</button>
        </sc-if>
        <sc-if value="{{t.off}}" hint-placeholder-val="{{true}}">
          <button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; font: inherit; font-size: 14px; color: #AEBBCC">{{t.label}}</button>
        </sc-if>
      </sc-for>
    </div>
  </section>

  <main style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{showApps}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
        <article style="padding: 18px; background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 12px; color: #5F6C80">Nộp ngày {{a.date}}</span>
          <a href="JobDetailMobile.dc.html" style="font-family: 'Playfair Display', Georgia, serif; font-size: 21px; line-height: 1.15; font-weight: 500; color: #0B1F3A; text-decoration: none">{{a.title}}</a>
          <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: {{a.bg}}; font-size: 13px; font-weight: 500; color: {{a.color}}">
            <span style="width: 7px; height: 7px; border-radius: 999px; background: {{a.color}}"></span>{{a.status}}
          </span>
          <span style="font-size: 13px; line-height: 1.6; color: #3A4A5E">{{a.note}}</span>
        </article>
      </sc-for>
    </sc-if>
    <sc-if value="{{showSaved}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{saved}}" as="j" hint-placeholder-count="2">
        <article style="padding: 18px; background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 12px; color: {{j.dueColor}}">{{j.due}}</span>
          <strong style="font-family: 'Playfair Display', Georgia, serif; font-size: 21px; line-height: 1.15; font-weight: 500">{{j.title}}</strong>
          <span style="font-size: 14px; font-weight: 500; color: #1C3F78">{{j.salary}}</span>
          <a href="ApplyMobile.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 4px; background: #1C3F78; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Ứng tuyển</a>
        </article>
      </sc-for>
    </sc-if>
    <sc-if value="{{showProfile}}" hint-placeholder-val="{{false}}">
      <section style="padding: 18px; background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 6px; display: flex; flex-direction: column; gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Họ tên</span><input value="Trần Minh Anh" style="min-height: 50px; padding: 0 14px; border: 1px solid #DDE3EB; border-radius: 4px; font: inherit; font-size: 16px; color: #0B1F3A"></label>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #E4E9F0; border-radius: 4px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C3F78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>
          <span style="flex: 1; font-size: 14px">CV_TranMinhAnh.pdf</span>
          <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 14px">Đổi</a>
        </div>
        <button type="button" style="min-height: 50px; border: 0; border-radius: 4px; background: #1C3F78; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">Lưu</button>
      </section>
      <a href="Privacy.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px">Chính sách dữ liệu</a>
      <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 2px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #A23B2A">Xóa dữ liệu của tôi</button>
      <a href="MainMobile.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; color: #556479">Đăng xuất</a>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'apps' };
  }
  renderVals() {
    const tab = this.state.tab;
    const apps = [
      { title: 'Nhân viên Kinh doanh B2B', date: '21/10/2026', status: 'Mời phỏng vấn', color: '#1C3F78', bg: '#EEF2F7', note: 'HR sẽ gọi hoặc nhắn Zalo để hẹn lịch.' },
      { title: 'Chuyên viên Tuyển dụng', date: '15/10/2026', status: 'HR đã xem', color: '#3A4A5E', bg: '#EEF2F7', note: 'Hồ sơ đang được xem xét.' },
      { title: 'Nhân viên Hành chính', date: '02/10/2026', status: 'Đã đóng', color: '#5F6C80', bg: '#EEF2F7', note: 'Vị trí đã tuyển đủ. Cảm ơn bạn đã quan tâm.' }
    ];
    const saved = [
      { title: 'Chuyên viên Marketing Nội dung', salary: '13 – 17 triệu', due: 'Hạn 25/11', dueColor: '#556479' },
      { title: 'Thực tập sinh Kinh doanh', salary: 'Hỗ trợ 4 triệu', due: 'Hạn 15/12', dueColor: '#556479' }
    ];
    const defs = [['apps', 'Đã nộp 3'], ['saved', 'Đã lưu 2'], ['profile', 'Thông tin']];
    return {
      tabs: defs.map(([id, label]) => ({ label, on: id === tab, off: id !== tab, pick: () => this.setState({ tab: id }) })),
      showApps: tab === 'apps', showSaved: tab === 'saved', showProfile: tab === 'profile',
      apps, saved
    };
  }
}
</script>
</body>
</html>
