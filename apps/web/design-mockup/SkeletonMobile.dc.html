<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trạng thái tải (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible,summary:focus-visible,[role="tab"]:focus-visible{outline:2px solid #4A78C2;outline-offset:2px;border-radius:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.sk{background:#E9EDF3;border-radius:4px;animation:pulse 1.6s ease-in-out infinite}
.skd{background:rgba(197,207,220,.16);border-radius:4px;animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sk,.skd{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #0B1F3A; background: #F5F7FA">
  <span role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Đang tải…</span>
  <section style="background: #0B1F3A; color: #FFFFFF; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 10px">
        <svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="none" stroke="#C5CFDC" stroke-width="1.2"></circle><path d="M7 14c2.6-2.4 5.2-2.4 8 0s5.4 2.4 8 0M7 18.5c2.6-2.4 5.2-2.4 8 0s5.4 2.4 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Playfair Display', Georgia, serif; line-height: 1.2; font-size: 18px; font-weight: 500">[Tên công ty]</span>
      </span>
      <span class="skd" style="width: 44px; height: 44px"></span>
    </div>
    <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 28px; line-height: 1.15; font-weight: 500">Cùng xây sự nghiệp với [Tên công ty]</span>
    <span style="height: 50px; border-radius: 6px; background: #FFFFFF"></span>
  </section>
  <div aria-hidden="true" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 18px; padding-bottom: 8px"><span class="sk" style="width: 56px; height: 14px"></span><span class="sk" style="width: 72px; height: 14px"></span><span class="sk" style="width: 64px; height: 14px"></span></div>
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <div style="padding: 18px; background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
        <span class="sk" style="width: 80px; height: 11px"></span>
        <span class="sk" style="width: {{c.w}}; height: 22px"></span>
        <span class="sk" style="width: 110px; height: 16px"></span>
        <div style="display: flex; gap: 12px"><span class="sk" style="width: 90px; height: 12px"></span><span class="sk" style="width: 70px; height: 12px"></span></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { cards: ['80%', '64%', '72%'].map((w) => ({ w })) };
  }
}
</script>
</body>
</html>
