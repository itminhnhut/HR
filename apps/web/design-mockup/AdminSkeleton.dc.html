<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HR – Đang tải</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
@media (max-width: 720px){.rg1{grid-template-columns:minmax(0,1fr)!important}.rg2{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width: 960px){.tblwrap{overflow-x:auto}}
a:focus-visible,button:focus-visible,summary:focus-visible,[role="tab"]:focus-visible{outline:2px solid #4A78C2;outline-offset:2px;border-radius:4px}
a{color:#23477F}a:hover{color:#0B1F3A}
.row{transition:background-color .2s ease}.row:hover{background:#F8FAFC}
.btn{transition:filter .2s ease}.btn:hover{filter:brightness(1.15)}
.act{transition:background-color .2s ease}.act:hover{background:#EEF2F7}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.sk{background:#E9EDF3;border-radius:4px;animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.sk{animation:none}}
</style>
</helmet>
<div style="font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #0B1F3A; background: #F5F7FA; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #0B1F3A; color: #AEBBCC; padding: 26px 16px; display: flex; flex-direction: column; gap: 28px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 0 10px; text-decoration: none; color: #FFFFFF">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="none" stroke="#C5CFDC" stroke-width="1.2"></circle><path d="M7 14c2.6-2.4 5.2-2.4 8 0s5.4 2.4 8 0M7 18.5c2.6-2.4 5.2-2.4 8 0s5.4 2.4 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-family: 'Playfair Display', Georgia, serif; line-height: 1.2; font-weight: 500; font-size: 18px">[Tên công ty]</span><span style="font-size: 12px; color: #AEBBCC">Quản trị tuyển dụng</span></span>
    </a>
    <nav aria-label="Quản trị" style="display: flex; flex-direction: column; gap: 4px">
      <a href="AdminJobs.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); border-left: 2px solid #C5CFDC; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Tin tuyển dụng
      </a>
      <a href="AdminApplicants.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px 0 14px; border-radius: 4px; color: #AEBBCC; font-size: 14px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path><path d="M3 13h5l1.5 2.5h5L16 13h5"></path></svg>
        <span style="flex: 1">Hồ sơ ứng viên</span>
        <span style="min-width: 22px; padding: 2px 7px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #0B1F3A; font-size: 12px; font-weight: 600; text-align: center">3</span>
      </a>
      <a href="AdminSubscribers.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px 0 14px; border-radius: 4px; color: #AEBBCC; font-size: 14px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        Người chờ tin
      </a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px 0 14px; border-radius: 4px; color: #AEBBCC; font-size: 14px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
        Xem trang ứng viên
      </a>
    </nav>
    <a href="AdminLogin.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px 0 14px; border-radius: 4px; border-top: 1px solid rgba(197, 207, 220, 0.18); color: #AEBBCC; font-size: 14px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"></path><path d="M10 17l-5-5 5-5M5 12h11"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span>Đăng xuất</span><span style="font-size: 12px; color: #AEBBCC">hr@[tên miền].vn</span></span>
    </a>
  </aside>

  <main style="flex: 999 1 600px; min-width: 0; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px">
    <span role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Đang tải…</span>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 36px; line-height: 1.15; font-weight: 500">{{title}}</h1>
        <span class="sk" style="width: 280px; height: 14px"></span>
      </div>
      <sc-if value="{{isJobs}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 4px; background: #1C3F78; color: #FFFFFF; font-size: 14px; font-weight: 500">Đăng tin mới</span></sc-if>
    </div>
    <div aria-hidden="true" style="display: flex; gap: 22px; border-bottom: 1px solid #E4E9F0; padding-bottom: 12px">
      <span class="sk" style="width: 60px; height: 14px"></span><span class="sk" style="width: 84px; height: 14px"></span><span class="sk" style="width: 70px; height: 14px"></span><span class="sk" style="width: 76px; height: 14px"></span>
    </div>

    <sc-if value="{{isJobs}}" hint-placeholder-val="{{true}}">
      <div aria-hidden="true" class="tblwrap" style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 6px; overflow: hidden">
        <div style="display: grid; grid-template-columns: minmax(0, 2.4fr) 1fr 1fr 1fr 1.6fr; gap: 20px; padding: 16px 20px; border-bottom: 1px solid #EDF0F4">
          <span class="sk" style="width: 70px; height: 11px"></span><span class="sk" style="width: 60px; height: 11px"></span><span class="sk" style="width: 50px; height: 11px"></span><span class="sk" style="width: 56px; height: 11px"></span><span></span>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
          <div style="display: grid; grid-template-columns: minmax(0, 2.4fr) 1fr 1fr 1fr 1.6fr; gap: 20px; align-items: center; padding: 20px; border-bottom: 1px solid #EDF0F4">
            <span style="display: flex; flex-direction: column; gap: 8px"><span class="sk" style="width: {{r.w}}; height: 16px"></span><span class="sk" style="width: 120px; height: 12px"></span></span>
            <span class="sk" style="width: 90px; height: 22px; border-radius: 999px"></span>
            <span class="sk" style="width: 40px; height: 16px"></span>
            <span class="sk" style="width: 80px; height: 14px"></span>
            <span style="display: flex; gap: 8px; justify-content: flex-end"><span class="sk" style="width: 84px; height: 36px"></span><span class="sk" style="width: 36px; height: 36px"></span></span>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isApps}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" class="rg1" style="display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start">
        <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 6px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <div style="display: flex; gap: 12px; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EDF0F4">
              <span class="sk" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px"></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 7px"><span class="sk" style="width: 55%; height: 14px"></span><span class="sk" style="width: {{r.w}}; height: 11px"></span></span>
              <span class="sk" style="width: 44px; height: 11px"></span>
            </div>
          </sc-for>
        </div>
        <div style="padding: 28px; background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 6px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; gap: 16px; align-items: center"><span class="sk" style="width: 56px; height: 56px; border-radius: 999px"></span><span style="display: flex; flex-direction: column; gap: 8px"><span class="sk" style="width: 220px; height: 22px"></span><span class="sk" style="width: 160px; height: 13px"></span></span></div>
          <div style="display: flex; gap: 10px"><span class="sk" style="width: 110px; height: 46px"></span><span class="sk" style="width: 120px; height: 46px"></span><span class="sk" style="width: 110px; height: 46px"></span></div>
          <span class="sk" style="width: 100%; height: 13px"></span><span class="sk" style="width: 85%; height: 13px"></span><span class="sk" style="width: 100%; height: 80px"></span>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["Tin tuyển dụng","Hồ sơ ứng viên"],"default":"Tin tuyển dụng"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const screen = this.props.screen ?? 'Tin tuyển dụng';
    return {
      title: screen,
      isJobs: screen === 'Tin tuyển dụng',
      isApps: screen === 'Hồ sơ ứng viên',
      rows: ['62%', '48%', '70%', '54%', '66%', '44%'].map((w) => ({ w }))
    };
  }
}
</script>
</body>
</html>
