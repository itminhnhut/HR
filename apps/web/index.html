<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>Tuyển dụng %COMPANY%</title>
    <meta
      name="description"
      content="Việc làm tại %COMPANY%, giải pháp đường ống và điều khiển lưu chất. Xem vị trí đang tuyển và gửi CV trong khoảng một phút, không cần tạo tài khoản."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Google tag (gtag.js). Live site only, and off on HR and candidate account pages (personal data in addresses). -->
    <script>
      window['ga-disable-%GA_ID%'] =
        location.origin !== '%TRACKED_ORIGIN%' || %UNTRACKED_PATHS%.test(location.pathname);
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=%GA_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '%GA_ID%');
    </script>
    <!-- Microsoft Clarity records the screen: live site and public pages only; HR and account pages never load it. -->
    <script>
      if (location.origin === '%TRACKED_ORIGIN%' && !%UNTRACKED_PATHS%.test(location.pathname)) {
        (function (c, l, a, r, i, t, y) {
          c[a] =
            c[a] ||
            function () {
              (c[a].q = c[a].q || []).push(arguments);
            };
          t = l.createElement(r);
          t.async = 1;
          t.src = 'https://www.clarity.ms/tag/' + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, 'clarity', 'script', '%CLARITY_ID%');
      }
    </script>
    <!-- Share previews (Zalo, Facebook, LinkedIn) read these without running the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Tuyển dụng %COMPANY%" />
    <meta property="og:title" content="Tuyển dụng %COMPANY%" />
    <meta
      property="og:description"
      content="Xem vị trí đang tuyển tại %COMPANY% và gửi CV trong khoảng một phút, không cần tạo tài khoản."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/og-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Đội ngũ %COMPANY% tại gian hàng triển lãm" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "%COMPANY%",
            "legalName": "Công ty Cổ phần Top Flow",
            "url": "https://topflow.vn",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Tòa nhà Pearl Plaza, 561A Điện Biên Phủ",
              "addressLocality": "TP. Hồ Chí Minh",
              "addressCountry": "VN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Tuyển dụng %COMPANY%",
            "inLanguage": "vi",
            "publisher": { "@id": "%SITE_URL%/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Trang cần bật JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
